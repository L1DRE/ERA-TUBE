name: Build YTMod for Sideloadly

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build tweak files
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          set -eux
          brew install ldid dpkg make
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"

      - name: Build tweak (.deb)
        run: |
          set -eux
          gmake package FINALPACKAGE=1
          ls -lh packages/

      - name: Fetch extension tweaks
        run: |
          set -u
          mkdir -p extras
          urls=(
            "https://github.com/PoomSmart/YouTubeSponsorBlock/releases/latest/download/com.ps.yt.sponsorblock.deb"
            "https://github.com/PoomSmart/YouPiP/releases/latest/download/com.ps.youpip.deb"
            "https://github.com/PoomSmart/YTUHD/releases/latest/download/com.ps.ytuhd.deb"
            "https://github.com/PoomSmart/Return-YouTube-Dislikes/releases/latest/download/com.ps.yt.rtyd.deb"
          )
          for u in "${urls[@]}"; do
            n=$(basename "$u")
            if curl -fsSL -o "extras/$n" "$u"; then
              echo "ok   $n"
            else
              rm -f "extras/$n"
              echo "::warning::not found, skipped: $n"
            fi
          done

      - name: Collect files for Sideloadly
        run: |
          set -eux
          mkdir -p out
          cp packages/*.deb out/YTMod.deb
          cp extras/*.deb out/ 2>/dev/null || true
          cp -R Resources/YTModResources.bundle out/
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTMod-for-Sideloadly
          path: out/
