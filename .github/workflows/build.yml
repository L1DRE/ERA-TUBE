name: Build YTMod for Sideloadly

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build tweak files
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          set -eux
          brew install ldid dpkg make
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"

      - name: Build tweak (.deb)
        run: |
          set -u
          # Job logs need a GitHub login; annotations are public, so surface errors there.
          # -k keeps compiling other files after one fails, so one run shows every broken file.
          if ! gmake -k package FINALPACKAGE=1 > build.log 2>&1; then
            cat build.log
            sed -E 's/\x1B\[[0-9;]*m//g; s#^.*/Sources/#Sources/#' build.log \
              | grep -E "error:" | sort -u > errors.txt
            if [ -s errors.txt ]; then
              head -10 errors.txt | while IFS= read -r l; do echo "::error::$l"; done
              tail -n +11 errors.txt | head -10 | while IFS= read -r l; do echo "::warning::(more) $l"; done
            else
              tail -10 build.log | while IFS= read -r l; do echo "::error::$l"; done
            fi
            exit 1
          fi
          cat build.log
          ls -lh packages/

      - name: Fetch YouPiP and YTUHD
        continue-on-error: true
        run: |
          set -eux
          mkdir -p extras
          python3 .github/scripts/fetch_poomsmart.py extras

      # No prebuilt .deb exists anywhere, so build it from source.
      - name: Build Return YouTube Dislike
        continue-on-error: true
        run: |
          set -u
          mkdir -p extras
          git clone --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          git clone --depth=1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"
          git clone --depth=1 https://github.com/PoomSmart/Return-YouTube-Dislikes.git ryd
          cd ryd
          if ! gmake package FINALPACKAGE=1 TARGET=iphone:clang:latest:14.0 > ../ryd.log 2>&1; then
            cat ../ryd.log
            sed -E 's/\x1B\[[0-9;]*m//g; s#^.*/ryd/#ryd/#' ../ryd.log | grep -E "error:" | sort -u | head -10 \
              | while IFS= read -r l; do echo "::error::RYD: $l"; done
            exit 1
          fi
          cp packages/*.deb ../extras/

      - name: Collect files for Sideloadly
        run: |
          set -eux
          mkdir -p out
          cp packages/*.deb out/YTMod.deb
          cp extras/*.deb out/ 2>/dev/null || true
          # No separate .bundle folders: each .deb already carries its bundle, and
          # Sideloadly fails with "Duplicated name" if one is added twice.
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTMod-for-Sideloadly
          path: out/
